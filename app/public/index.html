<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RailInvestigator</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#667085;--line:#d9dee6;--acc:#1f5fbf;--ok:#1a7f4b;--bad:#b42318;--ai:#7a3db8}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--ink:#e6eaf0;--mute:#98a2b3;--line:#2d3642;--acc:#6ea2f5;--ok:#4cc38a;--bad:#f97066;--ai:#b794f4}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0}nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--mute);padding:8px 12px;border-radius:6px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--bg);color:var(--ink);font-weight:600}
main{padding:16px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mute)}
.ai{color:var(--ai);border-color:var(--ai)}.mute{color:var(--mute);font-size:13px}
button.a,button.r{border:1px solid;border-radius:6px;padding:5px 12px;font:inherit;cursor:pointer;background:none}
button.a{color:var(--ok);border-color:var(--ok)}button.r{color:var(--bad);border-color:var(--bad)}
ol.tl{list-style:none;padding:0;margin:0;border-left:2px solid var(--line);margin-left:8px}
ol.tl li{padding:6px 0 6px 16px;position:relative}ol.tl li:before{content:"";position:absolute;left:-7px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--acc)}
svg{width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
svg text{fill:var(--ink);font-size:12px}svg rect{fill:var(--bg);stroke:var(--line)}svg path{stroke:var(--mute);fill:none}
form.f{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
form.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:2px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;max-width:100%}
button.p{border:0;background:var(--acc);color:var(--bg);border-radius:6px;padding:7px 14px;font:inherit;cursor:pointer}
button.s{border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}
.err{color:var(--bad);margin:0 0 10px}h3{margin:18px 0 6px;font-size:14px}
.empty{color:var(--mute);padding:24px;text-align:center}
</style></head><body>
<header><h1>RailInvestigator</h1>
<nav role="tablist" id="tabs"></nav><span class="mute">local only · AI proposes, you decide</span></header>
<main id="view" aria-live="polite"></main>
<script src="/app.js"></script></body></html>
