<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RailInvestigator</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#667085;--line:#d9dee6;--acc:#1f5fbf;--ok:#1a7f4b;--bad:#b42318;--ai:#7a3db8}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--ink:#e6eaf0;--mute:#98a2b3;--line:#2d3642;--acc:#6ea2f5;--ok:#4cc38a;--bad:#f97066;--ai:#b794f4}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0}nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--mute);padding:8px 12px;border-radius:6px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--bg);color:var(--ink);font-weight:600}
main{padding:16px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mute)}
.ai{color:var(--ai);border-color:var(--ai)}.mute{color:var(--mute);font-size:13px}
button.a,button.r{border:1px solid;border-radius:6px;padding:5px 12px;font:inherit;cursor:pointer;background:none}
button.a{color:var(--ok);border-color:var(--ok)}button.r{color:var(--bad);border-color:var(--bad)}
ol.tl{list-style:none;padding:0;margin:0;border-left:2px solid var(--line);margin-left:8px}
ol.tl li{padding:6px 0 6px 16px;position:relative}ol.tl li:before{content:"";position:absolute;left:-7px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--acc)}
svg{width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
svg text{fill:var(--ink);font-size:12px}svg rect{fill:var(--bg);stroke:var(--line)}svg path{stroke:var(--mute);fill:none}
form.f{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
form.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:2px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;max-width:100%}
button.p{border:0;background:var(--acc);color:var(--bg);border-radius:6px;padding:7px 14px;font:inherit;cursor:pointer}
button.s{border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}
.err{color:var(--bad);margin:0 0 10px}h3{margin:18px 0 6px;font-size:14px}
.empty{color:var(--mute);padding:24px;text-align:center}
</style></head><body>
<header><h1>RailInvestigator</h1>
<nav role="tablist" id="tabs"></nav><span class="mute">local only · AI proposes, you decide</span></header>
<main id="view" aria-live="polite"></main>
<script>
const $=(s)=>document.querySelector(s);
// All dynamic text goes through textContent — report text is untrusted.
function h(tag,attrs={},...kids){const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){k.startsWith("on")?e[k]=v:e.setAttribute(k,v)}
  for(const c of kids.flat())e.append(c instanceof Node?c:document.createTextNode(c??""));return e}
const api=(p,o)=>fetch(p,o).then(r=>r.json());
const TABS={build:"Case builder",review:"Review queue",timeline:"Timeline",causal:"Causal graph",recs:"Recommendations"};
let tab="build",editing=null,flash="";
function renderTabs(){const t=$("#tabs");t.replaceChildren(...Object.entries(TABS).map(([k,v])=>
  h("button",{role:"tab","aria-selected":k===tab,onclick:()=>{tab=k;show()}},v)))}
async function show(){renderTabs();const v=$("#view");v.replaceChildren(await VIEWS[tab]())}
const prov=(p)=>h("span",{class:"mute"},[p.source==="ai"?"AI":"human",p.confidence!=null?` · ${Math.round(p.confidence*100)}%`:"",p.citation?` · ${p.citation}`:""].join(""));
async function decide(kind,id,decision){await api("/api/review",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({kind,id,decision})});show()}
const buttons=(kind,id)=>h("span",{},h("button",{class:"a",onclick:()=>decide(kind,id,"accepted")},"Accept")," ",h("button",{class:"r",onclick:()=>decide(kind,id,"rejected")},"Reject"));

const VIEWS={
async build(){
  const [S,C]=await Promise.all([api("/api/schema"),api("/api/case")]);const d=h("div");
  const TL={};await Promise.all(C.nodes.filter(n=>n.type==="Occurrence").map(async o=>{TL[o.id]=await api("/api/timeline?id="+encodeURIComponent(o.id))}));
  const byId=Object.fromEntries(C.nodes.map(n=>[n.id,n]));
  const act=async(fn)=>{flash="";try{const r=await fn();if(r&&r.error)flash=r.error}catch(e){flash=String(e)}show()};
  const post=(path,method,b)=>api(path,{method,headers:{"content-type":"application/json"},body:JSON.stringify(b)});
  if(flash)d.append(h("p",{class:"err",role:"alert"},flash));

  // ---- add item ----
  const type=h("select",{id:"nt"},S.NODE_TYPES.map(t=>h("option",{value:t},t)));
  const label=h("input",{id:"nl",maxlength:"300",required:"",placeholder:"What is it?",size:"36"});
  const extra=h("span");
  const occs=C.nodes.filter(n=>n.type==="Occurrence");
  const syncExtra=()=>{extra.replaceChildren();
    if(type.value==="CausalFactor")extra.append(h("label",{},"Level",h("select",{id:"nx"},S.CAUSAL_LEVEL.map(v=>h("option",{value:v},v)))));
    if(type.value==="Occurrence")extra.append(h("label",{},"Class",h("select",{id:"nx"},S.OCCURRENCE_CLASS.map(v=>h("option",{value:v},v.replace("_"," "))))));
    if(type.value==="Event"&&occs.length){
      const pos=h("select",{id:"np"}),occSel=h("select",{id:"nx"},occs.map(o=>h("option",{value:o.id},o.label)));
      const fillPos=()=>pos.replaceChildren(h("option",{value:"end"},"At the end"),h("option",{value:"start"},"At the start"),
        ...(TL[occSel.value]||[]).map(e=>h("option",{value:e.id},"After: "+e.label)));
      occSel.onchange=fillPos;fillPos();
      extra.append(h("label",{},"Part of",occSel),h("label",{},"Place",pos))}};
  type.onchange=syncExtra;syncExtra();
  const addForm=h("form",{class:"f",onsubmit:(ev)=>{ev.preventDefault();
    const x=document.getElementById("nx"),b={type:type.value,label:label.value};
    if(x){if(type.value==="CausalFactor")b.props={level:x.value};if(type.value==="Occurrence")b.props={class:x.value};if(type.value==="Event"){b.occurrenceId=x.value;b.after=document.getElementById("np").value}}
    act(()=>post("/api/node","POST",b))}},
    h("label",{},"Type",type),h("label",{},"Label",label),extra,h("button",{class:"p",type:"submit"},"Add"));
  d.append(h("h3",{},"Add item"),h("div",{class:"card"},addForm));

  // ---- add link ----
  const et=h("select",{id:"et"},S.EDGE_TYPES.map(t=>h("option",{value:t},t)));
  const from=h("select",{id:"ef"}),to=h("select",{id:"eto"}),ev=h("select",{id:"ee"}),cit=h("input",{id:"ec",maxlength:"300",placeholder:"e.g. report p.14 §2",size:"22"});
  const evWrap=h("span",{},h("label",{},"Evidence",ev),h("label",{},"or citation",cit));
  const fill=(sel,types)=>{sel.replaceChildren(...C.nodes.filter(n=>types.includes(n.type)).map(n=>h("option",{value:n.id},`${n.label} (${n.type})`)))};
  const syncEdge=()=>{const r=S.EDGE_RULES[et.value];fill(from,r.from);fill(to,r.to);
    ev.replaceChildren(h("option",{value:""},"— none —"),...C.nodes.filter(n=>n.type==="Evidence").map(n=>h("option",{value:n.id},n.label)));
    evWrap.style.display=["CAUSED","CONTRIBUTED_TO"].includes(et.value)?"":"none"};
  et.onchange=syncEdge;syncEdge();
  const linkForm=h("form",{class:"f",onsubmit:(e)=>{e.preventDefault();
    act(()=>post("/api/edge","POST",{type:et.value,from:from.value,to:to.value,evidenceId:ev.value||undefined,citation:cit.value||undefined}))}},
    h("label",{},"Link type",et),h("label",{},"From",from),h("label",{},"To",to),evWrap,h("button",{class:"p",type:"submit"},"Link"));
  d.append(h("h3",{},"Link items"),h("div",{class:"card"},linkForm),
    h("p",{class:"mute"},"Causal links (CAUSED / CONTRIBUTED_TO) need evidence or a citation."));

  // ---- items ----
  d.append(h("h3",{},"Items"));
  if(!C.nodes.length)d.append(h("div",{class:"empty"},"Nothing yet — add an Occurrence to start."));
  for(const t of S.NODE_TYPES){const ns=C.nodes.filter(n=>n.type===t);if(!ns.length)continue;
    d.append(h("div",{class:"mute"},t));
    for(const n of ns){
      if(editing===n.id){const inp=h("input",{value:n.label,maxlength:"300",size:"40","aria-label":"Label"});
        d.append(h("form",{class:"card f",onsubmit:(e)=>{e.preventDefault();editing=null;act(()=>post("/api/node","PATCH",{id:n.id,label:inp.value}))}},inp,
          h("button",{class:"p",type:"submit"},"Save"),h("button",{class:"s",type:"button",onclick:()=>{editing=null;show()}},"Cancel")))}
      else d.append(h("div",{class:"card"},h("div",{class:"row"},
        h("div",{},n.label," ",n.status==="proposed"?h("span",{class:"tag ai"},"proposed"):"",n.props.level?h("span",{class:"tag"},n.props.level):"",n.props.class?h("span",{class:"tag"},n.props.class.replace("_"," ")):""),
        h("span",{},h("button",{class:"s",onclick:()=>{editing=n.id;show()}},"Edit")," ",
          h("button",{class:"r",onclick:()=>{if(confirm(`Remove "${n.label}" and its links? This is recorded in the audit log.`))act(()=>post("/api/remove","POST",{kind:"node",id:n.id}))}},"Remove")))))}}

  // ---- links ----
  d.append(h("h3",{},"Links"));
  if(!C.edges.length)d.append(h("div",{class:"empty"},"No links yet."));
  for(const e of C.edges)d.append(h("div",{class:"card"},h("div",{class:"row"},
    h("div",{},h("span",{class:"tag"},e.type)," ",e.fromLabel," → ",e.toLabel,e.status==="proposed"?h("span",{class:"tag ai"},"proposed"):"",
      (e.provenance.citation||e.provenance.evidenceId)?h("div",{class:"mute"},e.provenance.citation||("evidence: "+(byId[e.provenance.evidenceId]?.label??""))):""),
    h("button",{class:"r",onclick:()=>{if(confirm("Remove this link?"))act(()=>post("/api/remove","POST",{kind:"edge",id:e.id}))}},"Remove"))));
  return d},
async review(){const p=await api("/api/pending");const d=h("div");
  if(!p.nodes.length&&!p.edges.length)return h("div",{class:"empty"},"Nothing waiting for review.");
  d.append(h("p",{class:"mute"},"Proposed items are excluded from all analysis until you accept them."));
  for(const n of p.nodes)d.append(h("div",{class:"card"},h("div",{class:"row"},h("div",{},h("span",{class:"tag ai"},n.type)," ",n.label,h("br"),prov(n.provenance)),buttons("node",n.id))));
  for(const e of p.edges)d.append(h("div",{class:"card"},h("div",{class:"row"},h("div",{},h("span",{class:"tag ai"},e.type)," ",e.fromLabel," → ",e.toLabel,h("br"),prov(e.provenance)),buttons("edge",e.id))));
  return d},
async timeline(){const occ=await api("/api/occurrences");const d=h("div");
  if(!occ.length)return h("div",{class:"empty"},"No occurrences yet.");
  for(const o of occ){d.append(h("h2",{},o.label));const t=await api("/api/timeline?id="+encodeURIComponent(o.id));
    const move=async(eventId,after)=>{const r=await api("/api/place",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({eventId,occurrenceId:o.id,after})});
      flash=r.error||"";if(flash)alert(flash);show()};
    if(!t.length)d.append(h("div",{class:"empty"},"No events yet — add some in the Case builder."));
    d.append(h("ol",{class:"tl"},t.map(e=>{
      const sel=h("select",{"aria-label":"Move "+e.label,onchange:()=>{if(sel.value)move(e.id,sel.value)}},
        h("option",{value:""},"Move…"),h("option",{value:"start"},"To the start"),h("option",{value:"end"},"To the end"),
        ...t.filter(x=>x.id!==e.id).map(x=>h("option",{value:x.id},"After: "+x.label)));
      return h("li",{},h("span",{class:"row"},h("span",{},e.label),sel))})))}
  return d},
async causal(){const g=await api("/api/graph");const linked=new Set(g.edges.flatMap(e=>[e.from,e.to]));g.nodes=g.nodes.filter(n=>linked.has(n.id));if(!g.nodes.length)return h("div",{class:"empty"},"No accepted causal data.");
  // Layer by longest causal distance from sinks (effects on the right, root causes on the left).
  const out=new Map(g.nodes.map(n=>[n.id,[]]));g.edges.forEach(e=>out.get(e.from).push(e.to));
  const depth={};const dist=(id)=>depth[id]??(depth[id]=Math.max(0,...out.get(id).map(t=>dist(t)+1)));
  g.nodes.forEach(n=>dist(n.id));const maxD=Math.max(...Object.values(depth));
  const cols={};g.nodes.forEach(n=>(cols[maxD-depth[n.id]]??=[]).push(n));
  const W=190,H=44,GX=70,GY=20,pos={};
  Object.entries(cols).forEach(([c,ns])=>ns.forEach((n,i)=>pos[n.id]={x:10+c*(W+GX),y:10+i*(H+GY)}));
  const rows=Math.max(...Object.values(cols).map(c=>c.length));
  const NS="http://www.w3.org/2000/svg";const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${20+(maxD+1)*(W+GX)-GX} ${20+rows*(H+GY)-GY}`);svg.setAttribute("role","img");svg.setAttribute("aria-label","Causal graph");
  const mk=(t,a,txt)=>{const e=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);if(txt)e.textContent=txt;return e};
  for(const e of g.edges){const a=pos[e.from],b=pos[e.to];const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2;
    svg.append(mk("path",{d:`M${x1},${y1} C${x1+35},${y1} ${x2-35},${y2} ${x2},${y2}`,"stroke-dasharray":e.type==="CONTRIBUTED_TO"?"5 4":"0","stroke-width":1.5}))}
  for(const n of g.nodes){const p=pos[n.id];svg.append(mk("rect",{x:p.x,y:p.y,width:W,height:H,rx:6}));
    const words=n.label.split(" ");let l1="",l2="";words.forEach(w=>((l1+" "+w).length<=28&&!l2?l1+=" "+w:l2+=" "+w));
    svg.append(mk("text",{x:p.x+8,y:p.y+(l2?18:26)},l1.trim()));if(l2)svg.append(mk("text",{x:p.x+8,y:p.y+34},l2.trim().slice(0,30)))}
  return h("div",{},h("p",{class:"mute"},"Accepted items only. Solid = caused, dashed = contributed to. Left = root causes."),svg)},
async recs(){const r=await api("/api/recommendations");const d=h("div");
  d.append(h("h2",{},"Open recommendations (no action recorded)"));
  d.append(...(r.open.length?r.open.map(x=>h("div",{class:"card"},x.label)):[h("div",{class:"empty"},"None.")]));
  d.append(h("h2",{},"Causal factors with no recommendation"));
  d.append(...(r.unaddressed.length?r.unaddressed.map(x=>h("div",{class:"card"},x.label," ",h("span",{class:"tag"},x.props.level||"factor"))):[h("div",{class:"empty"},"None.")]));
  return d}
};
show();
</script></body></html>
